name: Watch upstream

# Detect when Riftcodex ships a new set or changes a card, regenerate against
# it, and open a PULL REQUEST. Nothing is published and nothing reaches main
# without review — `npx skills add` installs from main, so an unreviewed
# regeneration would go straight to every user.
#
# NOT SCHEDULED, and that is a finding rather than an oversight. Both upstreams
# refuse hosted CI: Riot's hosts drop the connection outright (http 000), and
# Riftcodex returns 403 to GitHub runners consistently across repeated runs
# while answering every User-Agent from an ordinary connection. It is the IP,
# not the agent string, and working around that would mean evading a bot
# protection rather than fixing anything.
#
# So a nightly run could only ever report "could not check". A red X every
# morning teaches people to ignore CI, and a green "all clear" would be a lie
# through an entire set release.
#
# Run `npm run oracle watch` locally instead — it takes one request. This
# workflow stays for manual dispatch and works unchanged the day it runs on a
# self-hosted runner, or if Cloudflare's posture changes.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if nothing changed upstream"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      # Exits 0 when upstream is unreachable and says so, rather than failing:
      # being unable to look is not a defect in this repository.
      - id: check
        run: npm run oracle watch

      - name: Report
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  regenerate:
    needs: detect
    if: needs.detect.outputs.changed == 'true' || inputs.force
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: npm ci && npm run build

      - name: Rebuild card data
        run: npm run oracle skill-data

      - name: Rebuild the rule index and rulebook
        run: |
          cd .claude/skills/rules-report/lib
          python3 rules_cli.py build

      # Deliberately non-fatal. A new set almost always ships equipment whose
      # granted effect the API omits, which fails the selftest by design — and
      # that is precisely when a human most needs to see a PR. The verdict goes
      # in the PR body, and ci.yml re-runs on the PR, so a broken corpus shows
      # red there rather than silently never being proposed.
      - name: Verify the corpus
        id: verify
        continue-on-error: true
        run: |
          cd .claude/skills/rules-report/lib
          python3 rules_cli.py selftest 2>&1 | tail -40 > /tmp/selftest.log
          echo "result=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/selftest.log

      - name: Record the upstream state this was built against
        run: npm run oracle watch -- --write

      - name: Refresh the version manifest
        run: npm run oracle package

      - name: Draft the changelog entry
        id: notes
        env:
          SUMMARY: ${{ needs.detect.outputs.summary }}
        run: |
          {
            echo "Upstream: $SUMMARY"
            echo
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "Corpus verified — all checks passed."
            else
              echo "**The corpus does not verify.** Do not merge until this is resolved:"
              echo
              echo '```'
              tail -20 /tmp/selftest.log
              echo '```'
            fi
            echo
            echo '```'
            npm run --silent oracle changelog 2>/dev/null | sed 's/^[│ ]*//' || true
            echo '```'
          } > /tmp/body.md
          # A new set almost always ships equipment whose granted effect the
          # API omits; the selftest fails on those, so say what to do about it.
          if ! grep -q '"cards_awaiting_transcription": 0' .claude/skills/rules-report/SKILL-VERSION.json; then
            {
              echo
              echo '> **Cards need transcribing.** Run `npm run oracle gear-gaps`, read the'
              echo '> granted-effect band off each image, and add entries to'
              echo '> `manifests/card-overlays.yaml`.'
            } >> /tmp/body.md
          fi
          {
            echo
            echo "Rules text is *not* refreshed by this job — the Rules Hub is unreachable from CI."
          } >> /tmp/body.md

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/upstream-refresh
          base: main
          title: "chore: refresh corpus — ${{ needs.detect.outputs.summary }}"
          body-path: /tmp/body.md
          commit-message: |
            chore: regenerate corpus from upstream

            ${{ needs.detect.outputs.summary }}

            Card data rebuilt from Riftcodex and re-verified. Rules text is
            unchanged — the Rules Hub is not reachable from CI.
          labels: corpus
          delete-branch: true
