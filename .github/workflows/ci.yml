name: CI

# `npx skills add gear-null/riftbound-oracle` installs from main, so main is a
# live distribution channel rather than a staging area. Everything below is
# deterministic — no model, no API key, no secrets — which is exactly why it
# can guard every push instead of relying on someone remembering to run it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The skill as a registry install actually receives it: the committed folder,
  # no build step, no dependencies. This is the job that matters most — it is
  # the only one testing what users get.
  skill:
    name: skill on python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the documented floor and the version macOS ships. A single
        # PEP-604 annotation once made the skill unimportable there, so the
        # floor is tested rather than asserted.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Proves the suite above can actually fail. Two review rounds found
      # checks that stayed green while the exact defect they were named for was
      # live, so the check count is only evidence if the checks have been seen
      # to go red. Runs on one Python version — it is about the checks, not the
      # interpreter — and only when the skill changes.
      - name: The selftest can fail
        if: matrix.python == '3.13'
        run: |
          cd .claude/skills/rules-report/lib
          python3 mutants.py

      # The release gate. Not "did the suite pass" but "is every promise in
      # docs/invariants.md still held up by a check that has been SEEN to fail".
      # Ten review rounds produced checks that passed while the defect they were
      # named for was live; this is what makes that visible.
      - name: Every invariant is pinned
        if: matrix.python == '3.13'
        run: python3 scripts/check-invariants.py

      - name: Corpus and citation checks
        working-directory: .claude/skills/rules-report/lib
        run: python3 rules_cli.py selftest

      - name: Answer a question end to end
        working-directory: .claude/skills/rules-report/lib
        run: |
          python3 rules_cli.py card "Stalking Wolf"
          python3 rules_cli.py rule 829.1.b.1
          python3 rules_cli.py grep chain
          # The gate must refuse a bad citation, not merely report one.
          python3 rules_cli.py report flow-counter-answer.json --no-open

      # Proves deck-lab's suite can fail. A pre-merge review found 54 defects
      # shipping past a green 71/71, because the checks tested the
      # implementation rather than the rules — deleting the 466.1.a.2 recall or
      # the 316.3 pool emptying left the suite green. Same reasoning as the
      # rules-report battery above, same gate.
      - name: The deck-lab selftest can fail
        if: matrix.python == '3.13'
        working-directory: .claude/skills/deck-lab/lib
        run: python3 mutants.py

      # The deck-lab table, on the same Python floor. It ships in the same
      # repo and installs the same way, so it is guarded the same way.
      - name: The deck-lab table holds a game
        working-directory: .claude/skills/deck-lab/lib
        run: python3 deck_cli.py selftest

      # Copying the folder has to be the whole install (ADR 0004), so this runs
      # the skill with the repo out of reach. `rules-report` has an equivalent
      # gate; deck-lab had none, and an import reaching into the repo would have
      # passed CI and failed on a user's first command.
      - name: The skill works with the repo out of reach
        run: |
          cp -R .claude/skills/deck-lab "$RUNNER_TEMP/deck-lab"
          cd "$RUNNER_TEMP/deck-lab/lib"
          python3 deck_cli.py selftest
          python3 deck_cli.py decks
          python3 deck_cli.py card "Stellacorn Herder"
          DECK=$(python3 -c "import deckfile,os; print(os.path.splitext(os.path.basename(sorted(deckfile.available())[0]))[0])")
          python3 deck_cli.py analyze "$DECK" --trials 2000
          python3 deck_cli.py report "$DECK" --trials 2000 --out /tmp/r.html
          test -s /tmp/r.html

      # Every shipped gauntlet deck must be playable. The previous version
      # checked one deck by name and passed while 5 of 24 were unusable.
      - name: Every shipped deck is legal and playable
        working-directory: .claude/skills/deck-lab/lib
        run: |
          python3 - <<'PY'
          import sys, deckfile
          bad = []
          for path in deckfile.available():
              d = deckfile.load(path)
              r = deckfile.check(d)
              if not r.legal:
                  bad.append((d.name, r.errors[:2]))
          for name, errs in bad:
              print(f"ILLEGAL {name}: {errs}")
          print(f"{len(deckfile.available()) - len(bad)}/{len(deckfile.available())} decks legal")
          sys.exit(1 if bad else 0)
          PY

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # The archive is only meaningfully reproducible if something rebuilds it.
  package:
    name: package reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Build twice and compare
        run: |
          # Every archive the packager emits, not just the first: a second skill
          # can be irreproducible while the one that happens to sort first is
          # stable, and a release checksum is per-archive.
          npm run oracle package >/dev/null
          first=$(cat dist/*.zip.sha256)
          npm run oracle package >/dev/null
          second=$(cat dist/*.zip.sha256)
          echo "$first"
          test "$first" = "$second" || {
            echo "::error::an archive is not reproducible — a release checksum would be meaningless"
            diff <(echo "$first") <(echo "$second") || true
            exit 1
          }

      - name: The site builds, and its verifiers can fail
        run: |
          # `site/build.py` enforces invariant 12 on the website and refuses a
          # stale corpus claim. It ran nowhere until a push to main, so a PR
          # could break the published site and nothing said so until after the
          # merge. Build it, prove the build is reproducible, and run the tests
          # that watch its two verifiers go red.
          python3 site/build.py
          python3 site/build_test.py
          DRIFT="$(git status --porcelain -- site/)"
          if [ -n "$DRIFT" ]; then
            echo "::error::site/ does not match what site/build.py produces."
            echo "Run 'python3 site/build.py' and commit the result."
            echo "$DRIFT"
            exit 1
          fi

      - name: The committed manifests match the corpus
        run: |
          # `oracle package` rewrites every SKILL-VERSION.json. If that changes
          # the tree, someone regenerated the corpus and forgot to commit the
          # manifest — so registry installs would advertise the wrong version.
          # Globbed, so a new skill is covered the day it is added rather than
          # the day someone remembers to extend this line.
          git diff --exit-code -- .claude/skills/*/SKILL-VERSION.json || {
            echo "::error::a SKILL-VERSION.json is stale — run 'npm run oracle package' and commit it"
            exit 1
          }
          # The battery above writes proven-checks.json, which is committed —
          # so a run that changes which checks have been WATCHED to fail leaves
          # the tree dirty. Silently, the recorded ratio would drift from
          # reality; loudly, it is one commit. Same trap, same guard.
          git diff --exit-code -- .claude/skills/*/lib/proven-checks.json || {
            echo "::error::proven-checks.json changed — the set of checks observed to fail moved."
            echo "Run the battery locally and commit the record."
            exit 1
          }

      - name: Install each archive the way a user would
        run: |
          # One `unzip dist/*.zip` would take the first archive and read the
          # rest as member names to extract FROM it — which is how a second
          # skill silently stopped being installed at all. Loop instead, and
          # run the verify command the skill's own manifest names, so this
          # step cannot drift from the packager's registry.
          mkdir -p /tmp/consumer
          for zip in dist/*.zip; do
            unzip -q "$zip" -d /tmp/consumer
          done
          shopt -s nullglob
          found=0
          for manifest in /tmp/consumer/*/SKILL-VERSION.json; do
            skill=$(dirname "$manifest")
            verify=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['verify'])" "$manifest")
            echo "::group::$(basename "$skill") — $verify"
            (cd "$skill/lib" && $verify)
            echo "::endgroup::"
            found=$((found + 1))
          done
          test "$found" -eq "$(ls -1 dist/*.zip | wc -l)" || {
            echo "::error::$found skills unpacked from $(ls -1 dist/*.zip | wc -l) archives — an archive did not install"
            exit 1
          }
